name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned
        run: |
          xcodebuild -project FilePatcher.xcodeproj -scheme FilePatcher -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FilePatcher.app Payload/
          zip -r FilePatcher.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FilePatcher-ipa
          path: FilePatcher.ipa
